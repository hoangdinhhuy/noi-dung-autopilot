<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gói nội dung — Chợ Nội Dung</title>
<style>
  :root{--bg:#faf9f7;--ink:#1a1a1a;--muted:#6b6b6b;--card:#fff;--line:#e7e3dc;--accent:#c2410c}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
  .wrap{max-width:880px;margin:0 auto;padding:24px 20px 80px}
  a.back{color:var(--accent);font-size:14px;text-decoration:none;font-weight:700}
  h1{font-size:26px;margin:10px 0 18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px}
  .card h3{font-size:17px;margin-bottom:10px}
  .line{display:flex;gap:10px;padding:8px 0;border-top:1px dashed var(--line);font-size:15px}
  .line b{min-width:118px;font-size:12px;letter-spacing:.05em;color:var(--muted);text-transform:uppercase;padding-top:2px}
  .btn{border:0;border-radius:8px;padding:7px 14px;font-size:13px;font-weight:700;cursor:pointer;background:var(--ink);color:#fff;margin-top:12px}
  .btn.ok{background:#166534}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">← Về trang chính</a>
  <h1 id="title">Đang tải…</h1>
  <div id="goi">…</div>
</div>
<script>
const ngay = new URLSearchParams(location.search).get('ngay');
document.getElementById('title').textContent = 'Gói ngày ' + (ngay || '?');
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
async function main(){
  try{
    const data = await (await fetch(`content/${ngay}.json`)).json();
    document.getElementById('goi').innerHTML = data.bai.map((b,i)=>`
      <div class="card">
        <h3>${i+1}. ${esc(b.ngach)} — ${esc(b.san_pham)}</h3>
        <div class="line"><b>Hook</b><span>${esc(b.hook)}</span></div>
        <div class="line"><b>Nỗi đau</b><span>${esc(b.noi_dau)}</span></div>
        <div class="line"><b>Giải pháp</b><span>${esc(b.giai_phap)}</span></div>
        <div class="line"><b>Tin cậy</b><span>${esc(b.tao_tin_cay)}</span></div>
        <div class="line"><b>CTA</b><span>${esc(b.cta)}</span></div>
        <div class="line"><b>Caption</b><span>${esc(b.caption)} ${esc((b.hashtags||[]).join(' '))}</span></div>
        <button class="btn copy" data-text="${encodeURIComponent(b.hook+'\n'+b.noi_dau+'\n'+b.giai_phap+'\n'+b.tao_tin_cay+'\n'+b.cta+'\n\n'+b.caption+'\n'+(b.hashtags||[]).join(' '))}">📋 Copy cả bài</button>
      </div>`).join('');
  }catch(e){
    document.getElementById('goi').textContent = 'Không tìm thấy gói này.';
  }
}
document.addEventListener('click', e=>{
  const b = e.target.closest('button.copy');
  if(!b) return;
  navigator.clipboard.writeText(decodeURIComponent(b.dataset.text)).then(()=>{
    b.textContent='✓ Đã copy!'; b.classList.add('ok');
    setTimeout(()=>{b.textContent='📋 Copy cả bài';b.classList.remove('ok')},1500);
  });
});
main();
</script>
</body>
</html>
